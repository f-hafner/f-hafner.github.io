10-5281-zenodo-11058058:
  doi: 10.5281/zenodo.11058058
  kind: talk
  section: papers
  preprint: false
  has_preprint: false
  title: 'Empirically testing privacy in machine learning : A review and some challenges'
  authors:
  - Flavio Hafner
  - Chang Sun
  year: 2024
  venue: null
  repository: Zenodo
  publisher: Zenodo
  abstract: How reliably do synthetic data from machine learning generators protect the privacy of the
    original data? We first review the empirical testing of privacy in machine learning, focusing on the
    intuitions for and assumptions behind such tests. We then discuss whether and how these tests could
    be used when evaluating generative algorithms for deployment at statistical agencies and in the health
    care system. Privacy audits assume strong adversaries and can identify bugs in the training algorithm.
    They could become standard in ensuring that a trained algorithm satisfies the level of privacy protection
    specified before training. Membership inference attacks, in contrast, assume realistic threat scenarios,
    but they do not scale in the size of the training data. Because these attacks can consider the specific
    context in which a privacy-preserving algorithm is released, they could be informative for practitioners---if
    the scaling challenge is solved. We suggest some ideas for future work and discussion in this direction.
