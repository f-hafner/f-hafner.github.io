  abstract: 'Administrative registry data can be used to construct population-scale networks whose ties
    reflect shared social contexts between persons. With machine learning, such networks can be encoded
    into numerical representations -- embeddings -- that automatically capture an individual''s position
    within the network. We created embeddings for all persons in the Dutch population from a population-scale
    network that represents five shared contexts: neighborhood, work, family, household, and school. To
    assess the informativeness of these embeddings, we used them to predict right-wing populist voting.
