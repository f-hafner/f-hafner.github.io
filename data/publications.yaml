  abstract: Applying machine learning to administrative registry data has challenged the limits of predicting
    social outcomes. In deep learning, prediction models often rely on embeddings that project complex
    input data into a latent numerical space. In the social sciences, embeddings can be used to compress
    social networks, which reduces their dimensionality while preserving information about the network
    structure. Registry data can be used to construct social networks at population-scale by creating
    ties between persons who belong to the same administrative entity (e.g., households, neighborhoods).
