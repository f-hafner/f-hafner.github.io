# Controlled vocabulary for the `tags` taxonomy.
#
# Key        = canonical slug (lowercase, hyphenated) == the Hugo taxonomy term,
#              so /tags/<slug>/ URLs stay stable. Slugify(old spelling) reproduces
#              it, which is why the legacy spellings below needed no mapping.
# title      = what cards and tag pages display.
# aliases    = spellings that do not slugify to the key; the sync script reports
#              them and suggests the canonical form.
#
# Categories are only a reading aid -- Hugo ignores unknown keys here.

